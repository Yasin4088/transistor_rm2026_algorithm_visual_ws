# 原AutoAimMacro参数（迁移后）
auto_aim_macro:
  image:
    save_img_freq: 0 # 0为不保存图片，其他值为保存图片的频率
    sync_camera_fps: true # 主循环帧数不超过输入帧率
  input:
    use_video: true # 使用视频输入（与use_images同时为true时优先视频）
    use_images: false # 使用图片集输入（当use_video为false时生效）
  control:
    fix_enemy_color: 1 # 0为红色，1为蓝色，其他值不强制
    fix_bullet_velocity: -1.0 # >=0时强制覆盖电控弹速；<0表示不强制覆盖
    filter_armor_class: 0 # 类别过滤掩码，0表示不过滤（如0b00000001过滤0号）
    fix_armor_class: -1 # 强制装甲板类别，-1表示不强制，0~7表示强制为对应类别
  log:
    log_result_video: false # 记录处理结果视频
    log_origin_video: false # 记录原始视频
  debug:
    debug_code: false # 是否在初始化后运行debug代码
    show_windows: false # 是否显示调试窗口（不控制visualizer.show_windows）

shared_memory_classifier:
  shm_key: 0x0250
  model_relative_path: "src/shared_files/models/model_rm2026_openvino/model.xml"

yolo:
  use_rp24_yolo: true
  model_relative_path: "src/shared_files/models/RP24_YOLO/0526.onnx"
  device: "CPU"

armor_detect_node:
  init_enemy_color: "BLUE" # 初始敌方颜色，连接至电控后会自动获取敌方颜色并覆盖此值
  max_armor_position_height: 1500.0 # 最大装甲板高度，超过此值视为无效
  camera:
    exposure_time: 5000.0
    gain: 16.0
    pc_ip: "192.168.10.25"
    cam_ip: "192.168.10.10"
  input_paths:
    video_relative_path: "InputVideo/infantry_blue.mp4"
    images_relative_path: "InputImages"
  ballistic:
    bullet_velocity: 15.0 # 初始弹速，连接至电控后会自动获取实时弹速并覆盖此值

solver:
  mount_offset:
    delta_x: 50.0 # 待修正
    delta_y: -50.0 # 待测
    delta_z: 30.0 # 待修正
  camera_calibration:
    camera_matrix:
      - [1.31280460e+03, 0.00000000e+00, 6.38736364e+02]
      - [0.00000000e+00, 1.31309593e+03, 5.34133502e+02]
      - [0.00000000e+00, 0.00000000e+00, 1.00000000e+00]
    dist_coeffs: [-0.05392145, -0.02516686, -0.00222499, -0.00149047, 0.43693918]

runtime:
  frame_rate: 80.0 # fps
  serial_delay_time: 30.0 # ms 电控信息相对相机画面快的时间
  performance_monitor:
    enabled: false
    report_interval: 90 # 累计多少帧输出一次平均耗时

visualizer:
  enable: true # 是否启用可视化
  show_windows: true # 是否显示窗口
  publish_topics: true # 是否发布话题
  log_video: true # 是否录制视频

predictor:
  extra_predict_time: 0.170 # s 除了弹丸飞行时间以外需要补偿的总时间
  pre_predict_time_not_aim: 500.0 # ms
  pre_predict_time: 2000.0 # ms
  reset_predictor_time: 1000.0 # ms
  choose_armor_yaw_bias_degree: 15.0 # 度
  rmm_visualize_zoom_out_factor: 10.0 # 平面可视化缩放系数
  fire_control:
    after_target_change_ceasefire_ms: 300
    before_target_change_ceasefire_ms: 100
    aim_center_vyaw_upper_threshold: 2.5
    aim_center_vyaw_lower_threshold: 2.0
    aim_center_yaw_bias_expand: 0.0
    low_vyaw_change_target_delta_yaw_threshold_degree: 30.0
    low_vyaw_threshold: 0.3

pid:
  pitch_integration_max_degree: 20.0
  pitch_integration_min_degree: -20.0
  yaw_integration_max_degree: 20.0
  yaw_integration_min_degree: -20.0
  command_picth_kp: 1.0
  command_picth_integration_speed: 0.1
  command_picth_integration_max_speed_degree: 5.0
  command_yaw_kp: 1.0
  command_yaw_integration_speed: 0.01
  command_yaw_integration_max_speed_degree: 5.0

detector_params:
  min_light_height: 8
  light_min_area: 3
  light_max_area: 4096
  max_light_wh_ratio: 100.0
  min_light_wh_ratio: 1
  light_max_tilt_angle: 60.0

light_bar_detector:
  binary_img_threshold: 180
  subtract_value: 120
  color_rect_expand_factor: 1.5
  mean_color_diff_threshold_blue: 20.0
  mean_color_diff_threshold_red: 10.0
  thres_max_color_red: 60
  thres_max_color_blue: 100
  light_bar_max_angle: 30.0

armor_detector:
  corners_expand_ratio: 1.5 # 装甲板角点坐标扩大比例
  corners_narrow_ratio: 0.8
  is_true_yolo_armor_brightness_ratio: 1.0
  height_correct_ratio_small: 1.22
  width_correct_ratio_small: 1.12
  height_correct_ratio_large: 1.26
  width_correct_ratio_large: 1.06
  max_angle_diff: 22.5
  max_height_diff_ratio: 0.65
  max_length_direction_mismatch_ratio: 1.5
  min_light_distance: 5.0
  max_light_distance: 50.0
  min_armor_confidence: 0.3
  max_expected_small_distance_mismatch_ratio: 0.35
  max_expected_large_distance_mismatch_ratio: 0.7

armor_classifier:
  max_roi_save_count: 20000
  classify_classes: 8
  is_armor_threshold: 0.5
  is_large_threshold: 0.5
  classify_threshold: 0.5
  input_height: 48
  input_width: 64

armor_tracker:
  max_tracking_age_ms: 100
  min_tracking_count: 2
  is_near_max_dist_ratio: 1.5
  fit_step: 5
  predict_step: 5
